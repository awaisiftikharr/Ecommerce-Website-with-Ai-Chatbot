name: Django checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ecommerce_project/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run recommendation tests
        run: python manage.py test recommendations
      - name: Run Django checks
        run: python manage.py check
