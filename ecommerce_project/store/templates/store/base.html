<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartFinds.pk</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-brand { font-weight: bold; font-size: 1.5rem; }
        .card { border: none; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .footer { background: #212529; color: white; padding: 40px 0; margin-top: 50px; }
        .btn-primary { background-color: #0d6efd; border: none; }
        .btn-primary:hover { background-color: #0b5ed7; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand text-warning" href="{% url 'store' %}">
                <i class="fas fa-shopping-bag"></i> SmartFinds.pk
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <form class="d-flex mx-auto my-2 my-lg-0" style="width: 50%;" method="GET" action="{% url 'store' %}">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search products..." aria-label="Search">
                    <button class="btn btn-warning" type="submit"><i class="fas fa-search"></i></button>
                </form>

                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
    <li class="nav-item"><a class="nav-link text-white" href="{% url 'store' %}">Home</a></li>
    
    {% if user.is_authenticated %}
        <li class="nav-item"><span class="nav-link text-warning">Hi, {{ user.username }}</span></li>
        <li class="nav-item"><a class="nav-link btn btn-danger btn-sm text-white ms-2" href="{% url 'logout' %}">Logout</a></li>
    {% else %}
        <li class="nav-item"><a class="nav-link text-white" href="{% url 'login' %}">Login</a></li>
        <li class="nav-item"><a class="nav-link btn btn-outline-light btn-sm ms-2" href="{% url 'register' %}">Sign Up</a></li>
    {% endif %}

    <li class="nav-item ms-3">
        <a class="btn btn-primary position-relative" href="{% url 'cart' %}">
            <i class="fas fa-shopping-cart"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </a>
    </li>
</ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4" style="min-height: 70vh;">
        {% block content %}{% endblock %}
    </div>

    <div class="footer text-center">
        <p>&copy; 2026 SmartFinds.pk | Final Year Project</p>
        <p>Accepted Payments: <span class="badge bg-secondary">JazzCash</span> <span class="badge bg-secondary">Credit Card</span> <span class="badge bg-secondary">COD</span></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    var user = '{{ request.user }}';

    function getToken(name) {
        var cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    var csrftoken = getToken('csrftoken');

    var updateBtns = document.getElementsByClassName('update-cart');

    for (var i = 0; i < updateBtns.length; i++) {
        updateBtns[i].addEventListener('click', function(){
            var productId = this.dataset.product;
            var action = this.dataset.action;
            console.log('productId:', productId, 'Action:', action);
            console.log('USER:', user);

            if (user === 'AnonymousUser'){
                alert("Please Login to add items to cart!");
                window.location.href = "/login/";
            } else {
                updateUserOrder(productId, action);
            }
        })
    }

    function updateUserOrder(productId, action){
        console.log('User is authenticated, sending data...');

        var url = '/update_item/';

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken,
            }, 
            body: JSON.stringify({'productId': productId, 'action': action})
        })
        .then((response) => {
            return response.json();
        })
        .then((data) => {
            console.log('Data:', data);
            location.reload(); // Refresh page to update cart number
        });
    }
</script>
</body>
</html>
