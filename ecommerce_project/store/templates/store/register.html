{% extends 'store/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-header bg-white text-center border-0 pt-4">
                <h3 class="fw-bold text-primary">Create Account</h3>
                <p class="text-muted small">Join SmartFinds for the best deals</p>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">
                                {{ field.errors|striptags }}
                            </div>
                        {% endif %}
                    </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Sign Up</button>
                </form>
                <p class="mt-4 text-center small text-muted">
                    Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-bold">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
